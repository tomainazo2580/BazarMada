<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur d'icône panier</title></head>
<body style="font-family:system-ui;padding:20px;text-align:center;background:#f0f7f2;color:#0b3d27">
<h2>🛒 Générer l'icône BazarMada</h2>
<p style="font-size:13px;color:#4b6b58">Touche chaque bouton — les fichiers se téléchargent, déjà nommés.</p>
<button onclick="dl(512)" style="padding:14px 20px;margin:8px;font-weight:800;background:#0e7a3d;color:#fff;border:none;border-radius:12px">Télécharger 512</button>
<button onclick="dl(192)" style="padding:14px 20px;margin:8px;font-weight:800;background:#0e7a3d;color:#fff;border:none;border-radius:12px">Télécharger 192</button>
<canvas id="cv" width="512" height="512" style="max-width:300px;margin-top:14px;border-radius:20px"></canvas>
<script>
function drawIcon(cv,size){
const x=cv.getContext("2d");
/* fond vert arrondi */
const r=size*0.22;
x.beginPath();
x.moveTo(r,0);x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);x.arcTo(size,0,size,0,r);x.arcTo(0,0,0,0,r);
x.fillStyle="#0e7a3d";x.fill();
/* panier : manche + corps, tracé blanc cassé, style flat */
const s=size/512;
x.strokeStyle="#f0f7f2";x.lineWidth=26*s;x.lineJoin="round";x.lineCap="round";
x.beginPath();
x.moveTo(96*s,136*s);
x.lineTo(166*s,136*s);
x.lineTo(180*s,196*s);
x.lineTo(416*s,196*s);
x.lineTo(376*s,376*s);
x.lineTo(196*s,376*s);
x.lineTo(164*s,226*s);
x.lineTo(96*s,226*s);
x.stroke();
/* roues */
x.fillStyle="#f0f7f2";
x.beginPath();x.arc(226*s,436*s,26*s,0,7);x.fill();
x.beginPath();x.arc(346*s,436*s,26*s,0,7);x.fill();
/* B vert clair dans le panier */
x.fillStyle="#a7f3d0";
x.font="bold "+Math.round(130*s)+"px Arial";
x.textAlign="center";x.textBaseline="middle";
x.fillText("B",272*s,292*s);
}
drawIcon(document.getElementById("cv"),512);
function dl(size){
const c=document.createElement("canvas");
c.width=size;c.height=size;
drawIcon(c,size);
const a=document.createElement("a");
a.download="icon-"+size+".png";
a.href=c.toDataURL("image/png");
a.click();
}
</script>
</body>
</html>
