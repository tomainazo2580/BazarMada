<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diagnostic</title></head>
<body style="font-family:system-ui;padding:20px;background:#111827;color:#fff">
<h2>🔧 Diagnostic admin</h2>
<input id="p" type="tel" placeholder="Téléphone" style="width:100%;padding:12px;margin:8px 0">
<input id="w" type="password" placeholder="Mot de passe" style="width:100%;padding:12px;margin:8px 0">
<button onclick="go()" style="width:100%;padding:14px;margin:8px 0;font-weight:800">TESTER</button>
<pre id="out" style="background:#000;padding:12px;white-space:pre-wrap;word-break:break-all;color:#6ee7b7;min-height:120px;margin-top:10px">Résultat ici…</pre>
<script>
const SB_URL="https://wisourxbnsnmsfgrskhv.supabase.co";
const SB_KEY="sb_publishable_0mt79uNrwTZCeU1BxPQwaw_5NWpPo_V";
async function go(){
const out=document.getElementById("out");
out.textContent="Test en cours…";
const p=document.getElementById("p").value.replace(/\D/g,"");
const w=document.getElementById("w").value;
try{
const r=await fetch(SB_URL+"/rest/v1/rpc/login_seller",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_phone:p,p_pass:w})});
const txt=await r.text();
out.textContent="HTTP "+r.status+"\n\n"+txt;
}catch(e){out.textContent="ERREUR RESEAU: "+e.message;}
}
</script>
</body></html>
