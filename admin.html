<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BazarMada — Admin v6</title>
<script>
window.addEventListener("error",function(e){var b=document.getElementById("errbar");if(b){b.textContent="⚠️ Erreur page : "+(e.message||"inconnue")+" (ligne "+e.lineno+")";b.style.display="block";}});
window.addEventListener("unhandledrejection",function(e){var r=e.reason;var b=document.getElementById("errbar");if(b){b.textContent="⚠️ Erreur : "+((r&&r.message)?r.message:r);b.style.display="block";}});
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#111827;color:#e5e7eb;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;color:#fff}
h1 span{color:#34d399}
.ver{font-size:11px;color:#6b7280;margin-top:2px}
.sub{font-size:13px;color:#9ca3af;margin:4px 0 20px}
.card{background:#1f2937;border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;color:#9ca3af;margin:12px 0 5px}
input,textarea{width:100%;padding:12px;border:1.5px solid #374151;border-radius:10px;font-size:15px;background:#111827;color:#fff}
textarea{min-height:64px;resize:vertical}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer}
.btn.green{background:#0e7a3d;color:#fff}
.btn.gray{background:#374151;color:#e5e7eb}
.btn.red{background:#7f1d1d;color:#fecaca}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:12px;border-radius:8px}
.typebtn{flex:1;padding:10px;border:2px solid #374151;border-radius:10px;background:#111827;color:#9ca3af;font-weight:800;font-size:13px;cursor:pointer}
.typebtn.on{border-color:#f59e0b;color:#fbbf24;background:#292524}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#1f2937;border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;color:#34d399}
.stat.hot b{color:#fbbf24}
.stat span{font-size:12px;color:#9ca3af}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{flex:1;padding:10px;border:none;border-radius:10px;background:#1f2937;color:#9ca3af;font-weight:700;font-size:13px;cursor:pointer;min-width:100px}
.tab.on{background:#0e7a3d;color:#fff}
.tab.alert{background:#78350f;color:#fde68a}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.b-active{background:#064e3b;color:#6ee7b7}
.b-hidden{background:#7f1d1d;color:#fecaca}
.b-block{background:#7f1d1d;color:#fecaca}
.b-ok{background:#1e3a5f;color:#93c5fd}
.b-admin{background:#4c1d95;color:#c4b5fd}
.b-hero{background:#78350f;color:#fcd34d}
.b-card{background:#1e3a5f;color:#93c5fd}
.b-pend{background:#78350f;color:#fde68a}
.t{font-weight:700;font-size:14px;color:#fff}
.m{font-size:12px;color:#9ca3af}
.grow{flex:1;min-width:150px}
.bthumb{width:90px;height:44px;border-radius:8px;object-fit:cover;flex:0 0 auto}
.prev{max-width:200px;border-radius:10px;margin-top:8px;display:block}
#status{padding:12px;border-radius:10px;font-size:14px;font-weight:700;margin-bottom:14px;display:none}
.s-wait{background:#1e3a5f;color:#93c5fd;display:block}
.s-ok{background:#064e3b;color:#6ee7b7;display:block}
.s-err{background:#7f1d1d;color:#fecaca;display:block}
#errbar{background:#450a0a;color:#fca5a5;padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">

<div id="errbar"></div>

<div id="login">
  <h1>🎛️ Bazar<span>Mada</span> — Admin</h1>
  <div class="ver">version 6 — paiements</div>
  <p class="sub">Accès réservé à l'administrateur</p>
  <div class="card">
    <label>Numéro de téléphone</label>
    <input id="l-phone" type="tel" placeholder="034 12 345 67">
    <label>Mot de passe</label>
    <input id="l-pass" type="password" placeholder="••••••">
    <div style="margin-top:16px"><button class="btn green" onclick="adminLogin()">Se connecter</button></div>
  </div>
</div>

<div id="panel" hidden>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <h1>🎛️ Bazar<span>Mada</span> — Admin</h1>
      <p class="sub" id="who"></p>
    </div>
    <button class="btn sm gray" onclick="adminLogout()">Déconnexion</button>
  </div>

  <div id="status"></div>
  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab" id="tab-pay" onclick="showTab('pay')">💰 Paiements</button>
    <button class="tab on" id="tab-ads" onclick="showTab('ads')">📢 Annonces</button>
    <button class="tab" id="tab-sellers" onclick="showTab('sellers')">👥 Vendeurs</button>
    <button class="tab" id="tab-banners" onclick="showTab('banners')">📣 Publicités</button>
  </div>

  <div id="pay-list" hidden></div>
  <div id="ads-list"></div>
  <div id="sellers-list" hidden></div>

  <div id="banners-list" hidden>
    <div class="card">
      <div class="t" style="margin-bottom:4px">➕ Nouvelle publicité</div>
      <div class="row" style="margin:10px 0">
        <button class="typebtn on" id="tb-hero" onclick="setBType('hero')">🏆 HERO (grand bandeau en haut)</button>
        <button class="typebtn" id="tb-card" onclick="setBType('card')">📢 CARTE (dans la grille)</button>
      </div>
      <div class="m" id="b-type-help" style="margin-bottom:6px">Grand bandeau pleine largeur affiché au-dessus des annonces. Rotation automatique entre vos annonceurs.</div>
      <label>Nom de l'annonceur *</label>
      <input id="b-adv" maxlength="40" placeholder="Ex : Telma Madagascar">
      <label>Titre</label>
      <input id="b-title" maxlength="60" placeholder="Ex : Fibre & 4G+ : Vitesse Max">
      <label>Description</label>
      <textarea id="b-desc" maxlength="160" placeholder="Ex : Installez la fibre dans vos bureaux..."></textarea>
      <label>Lien (bouton « Découvrir »)</label>
      <input id="b-link" type="url" placeholder="Ex : https://wa.me/261343994907">
      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn gray" style="flex:1" onclick="document.getElementById('b-img').click()">🖼️ Choisir l'image</button>
        <button class="btn green" style="flex:1" onclick="addBanner()">Ajouter</button>
      </div>
      <input id="b-img" type="file" accept="image/*" hidden>
      <img id="b-prev" class="prev" hidden alt="">
    </div>
    <div id="banners-rows"></div>
  </div>
</div>

</div>
<script>
const SB_URL="https://wisourxbnsnmsfgrskhv.supabase.co";
const SB_KEY="sb_publishable_0mt79uNrwTZCeU1BxPQwaw_5NWpPo_V";
let S=null,bFile=null,bType="hero";
try{S=JSON.parse(sessionStorage.getItem("bm_admin")||"null")}catch(e){S=null}

function showErr(txt){
const b=document.getElementById("errbar");
if(!txt){b.style.display="none";b.textContent="";return;}
b.textContent="⚠️ "+txt;
b.style.display="block";
}
function status(txt,kind){
const s=document.getElementById("status");
s.textContent=txt;s.className=kind?"s-"+kind:"";
if(!kind)s.style.display="none";
}
function toast(m){status(m,"ok");setTimeout(function(){if(document.getElementById("status").textContent===m)status("");},3000);}
function fmt(n){return new Intl.NumberFormat("fr-FR").format(n)+" Ar";}
function normPhone(p){p=String(p).replace(/\D/g,"");if(p.length===12&&p.indexOf("261")===0)p="0"+p.slice(3);return p;}
function esc(s){return String(s==null?"":s).replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function isBoosted(a){return a.boosted_until&&new Date(a.boosted_until)>new Date();}

async function rpc(name,args){
const r=await fetch(SB_URL+"/rest/v1/rpc/"+name,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
const d=await r.json().catch(function(){return {};});
if(!r.ok)throw new Error(d.message||("HTTP "+r.status));
return d;
}

async function adminLogin(){
showErr("");status("Connexion en cours…","wait");
const phone=normPhone(document.getElementById("l-phone").value);
const pass=document.getElementById("l-pass").value;
if(!phone||!pass){status("Remplis numéro et mot de passe","err");return;}
try{
const d=await rpc("login_seller",{p_phone:phone,p_pass:pass});
if(!d||!d.is_admin){status("⛔ Accès réservé — ce compte n'est pas admin","err");return;}
S=d;
try{sessionStorage.setItem("bm_admin",JSON.stringify(d));}catch(e){}
openPanel();
}catch(e){status("❌ "+(e.message||"Connexion impossible"),"err");}
}

function adminLogout(){
S=null;
try{sessionStorage.removeItem("bm_admin");}catch(e){}
document.getElementById("panel").hidden=true;
document.getElementById("login").hidden=false;
status("");
}

function openPanel(){
status("");
document.getElementById("login").hidden=true;
document.getElementById("panel").hidden=false;
document.getElementById("who").textContent="Connecté : "+(S.name||S.phone);
refreshAll();
}

async function refreshAll(){
status("Chargement…","wait");
let pendCount=0;
try{
const st=await rpc("admin_stats",{p_token:S.token});
pendCount=st.payments_pending||0;
document.getElementById("stats").innerHTML=
'<div class="stat'+(pendCount>0?" hot":"")+'"><b>'+pendCount+'</b><span>À valider 💰</span></div>'+
'<div class="stat"><b>'+st.ads_total+'</b><span>Annonces</span></div>'+
'<div class="stat"><b>'+st.ads_active+'</b><span>Actives</span></div>'+
'<div class="stat"><b>'+st.ads_today+'</b><span>Aujourd\'hui</span></div>'+
'<div class="stat"><b>'+st.sellers_total+'</b><span>Vendeurs</span></div>'+
'<div class="stat"><b>'+(st.banners_active!=null?st.banners_active:"?")+'</b><span>Pubs ON</span></div>';
document.getElementById("tab-pay").className="tab"+(pendCount>0?" alert":"");
}catch(e){status("⚠️ "+(e.message||"Erreur stats"),"err");}
try{await loadPayments();}catch(e){status("⚠️ Paiements : "+(e.message||"erreur"),"err");}
try{await loadAds();}catch(e){status("⚠️ Annonces : "+(e.message||"erreur"),"err");}
try{await loadSellers();}catch(e){status("⚠️ Vendeurs : "+(e.message||"erreur"),"err");}
try{await loadBanners();}catch(e){status("⚠️ Publicités : "+(e.message||"erreur"),"err");}
status("");
}

function showTab(t){
document.getElementById("tab-pay").className="tab"+(t==="pay"?" on":"");
document.getElementById("tab-ads").className="tab"+(t==="ads"?" on":"");
document.getElementById("tab-sellers").className="tab"+(t==="sellers"?" on":"");
document.getElementById("tab-banners").className="tab"+(t==="banners"?" on":"");
document.getElementById("pay-list").hidden=(t!=="pay");
document.getElementById("ads-list").hidden=(t!=="ads");
document.getElementById("sellers-list").hidden=(t!=="sellers");
document.getElementById("banners-list").hidden=(t!=="banners");
}

/* ===== 💰 Paiements ===== */
const KINDL={boost7:"🔥 Coup de pouce 7 j",boost30:"🔥 Coup de pouce 30 j",pro1:"⭐ Compte Pro — 1 mois"};

async function loadPayments(){
const list=await rpc("admin_list_payments",{p_token:S.token});
let html="";
if(list&&list.length){
for(let i=0;i<list.length;i++){
const p=list[i];
const pending=(p.status==="pending");
html+='<div class="card"><div class="row">'+
'<div class="grow"><div class="t">'+(KINDL[p.kind]||p.kind)+' — '+fmt(p.amount)+'</div>'+
'<div class="m">'+esc(p.seller_name||"Vendeur")+' · ☎️ '+esc(p.seller_phone||"?")+'</div>'+
(p.ad_title?'<div class="m">Annonce : '+esc(p.ad_title)+'</div>':'')+
'<div class="m">'+(p.created_at?new Date(p.created_at).toLocaleString("fr-FR"):"")+'</div></div>'+
'<span class="badge '+(pending?"b-pend":(p.status==="approved"?"b-active":"b-hidden"))+'">'+(pending?"⏳ en attente":(p.status==="approved"?"✅ validé":"❌ refusé"))+'</span>'+
(pending?'<button class="btn sm green" onclick="decidePay('+p.id+',true)">Valider</button><button class="btn sm red" onclick="decidePay('+p.id+',false)">Refuser</button>':'')+
'</div></div>';
}
}else html='<div class="card"><p class="sub">Aucun paiement pour l\'instant.<br>Quand un vendeur paiera un boost ou Pro, sa demande apparaîtra ici.</p></div>';
document.getElementById("pay-list").innerHTML=html;
}

async function decidePay(id,ok){
if(!confirm(ok?"Valider ce paiement et activer l'offre ?":"Refuser ce paiement ?"))return;
status("Traitement…","wait");
try{await rpc("admin_decide_payment",{p_token:S.token,p_payment_id:id,p_approve:ok});toast(ok?"✅ Validé — offre activée":"Paiement refusé");await refreshAll();}
catch(e){status("⚠️ "+(e.message||"Erreur"),"err");}
}

async function loadAds(){
const list=await rpc("admin_list_ads",{p_token:S.token,p_limit:100});
let html="";
if(list&&list.length){
for(let i=0;i<list.length;i++){
const a=list[i];
const vis=(a.status==="active");
html+='<div class="card"><div class="row">'+
'<div class="grow"><div class="t">'+esc(a.title)+'</div>'+
'<div class="m">'+fmt(a.price)+' · 📍 '+esc(a.city)+' · '+esc(a.cat)+'</div>'+
'<div class="m">☎️ '+esc(a.phone)+' · '+(a.created_at?new Date(a.created_at).toLocaleDateString("fr-FR"):"")+'</div></div>'+
(isBoosted(a)?'<span class="badge b-hero">🔥 boosté</span>':'')+
'<span class="badge '+(vis?"b-active":"b-hidden")+'">'+(vis?"visible":"masquée")+'</span>'+
'<button class="btn sm gray" onclick="toggleAd('+a.id+',\''+(vis?"hidden":"active")+'\')">'+(vis?"Masquer":"Afficher")+'</button>'+
'<button class="btn sm red" onclick="removeAd('+a.id+')">Supprimer</button>'+
'</div></div>';
}
}else html='<p class="sub">Aucune annonce.</p>';
document.getElementById("ads-list").innerHTML=html;
}

async function toggleAd(id,st){
status("Modification…","wait");
try{await rpc("admin_set_ad_status",{p_token:S.token,p_ad_id:id,p_status:st});toast("✅ Fait");await refreshAll();}
catch(e){status("⚠️ "+(e.message||"Erreur"),"err");}
}

async function removeAd(id){
if(!confirm("Supprimer définitivement cette annonce ?"))return;
status("Suppression…","wait");
try{await rpc("admin_delete_ad",{p_token:S.token,p_ad_id:id});toast("🗑️ Supprimée");await refreshAll();}
catch(e){status("⚠️ "+(e.message||"Erreur"),"err");}
}

async function loadSellers(){
const list=await rpc("admin_list_sellers",{p_token:S.token});
let html="";
if(list&&list.length){
for(let i=0;i<list.length;i++){
const v=list[i];
const pro=v.pro_until&&new Date(v.pro_until)>new Date();
html+='<div class="card"><div class="row">'+
'<div class="grow"><div class="t">'+esc(v.name||"Vendeur")+'</div>'+
'<div class="m">☎️ '+esc(v.phone)+' · '+v.ads_count+' annonce(s)</div>'+
'<div class="m">Inscrit le '+(v.created_at?new Date(v.created_at).toLocaleDateString("fr-FR"):"?")+(pro?' · ⭐ Pro':(v.pro_until?' · Pro expiré':''))+'</div></div>'+
(v.is_admin?'<span class="badge b-admin">👑 admin</span>':'')+
(pro?'<span class="badge b-hero">⭐ Pro</span>':'')+
'<span class="badge '+(v.blocked?"b-block":"b-ok")+'">'+(v.blocked?"bloqué":"actif")+'</span>'+
(v.id===S.seller_id?'':'<button class="btn sm '+(v.blocked?"green":"gray")+'" onclick="toggleBlock(\''+v.id+'\')">'+(v.blocked?"Débloquer":"Bloquer")+'</button>')+
'</div></div>';
}
}else html='<p class="sub">Aucun vendeur.</p>';
document.getElementById("sellers-list").innerHTML=html;
}

async function toggleBlock(id){
status("Modification…","wait");
try{await rpc("admin_toggle_block",{p_token:S.token,p_seller_id:id});toast("✅ Fait");await refreshAll();}
catch(e){status("⚠️ "+(e.message||"Erreur"),"err");}
}

/* ===== 📣 Publicités ===== */
function setBType(t){
bType=t;
document.getElementById("tb-hero").className="typebtn"+(t==="hero"?" on":"");
document.getElementById("tb-card").className="typebtn"+(t==="card"?" on":"");
document.getElementById("b-type-help").textContent=(t==="hero")
?"Grand bandeau pleine largeur au-dessus des annonces. Rotation entre annonceurs à chaque actualisation."
:"Carte qui prend la place d'une annonce dans la grille, tous les 6 articles. Rotation entre annonceurs.";
}

function shrinkImg(file){
return new Promise(function(resolve,reject){
const img=new Image();
img.onload=function(){
const max=1024;
let w=img.width,h=img.height;
if(w>h&&w>max){h=Math.round(h*max/w);w=max;}
else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
const c=document.createElement("canvas");
c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
c.toBlob(function(b){b?resolve(b):reject(new Error("compression"));},"image/jpeg",0.75);
URL.revokeObjectURL(img.src);
};
img.onerror=function(){reject(new Error("lecture image"));};
img.src=URL.createObjectURL(file);
});
}

async function uplBanner(file){
const blob=await shrinkImg(file);
const name="banner_"+Date.now()+"_"+Math.floor(Math.random()*1e6)+".jpg";
const r=await fetch(SB_URL+"/storage/v1/object/photos/"+name,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"image/jpeg"},body:blob});
if(!r.ok)throw new Error("upload "+r.status);
return SB_URL+"/storage/v1/object/public/photos/"+name;
}

document.getElementById("b-img").addEventListener("change",function(e){
bFile=e.target.files[0]||null;
const p=document.getElementById("b-prev");
if(bFile){p.src=URL.createObjectURL(bFile);p.hidden=false;}else{p.hidden=true;}
});

async function addBanner(){
const adv=document.getElementById("b-adv").value.trim();
if(!bFile){status("Choisis d'abord une image 🖼️","err");return;}
if(!adv){status("Le nom de l'annonceur est obligatoire","err");return;}
status("Envoi de la publicité…","wait");
try{
const url=await uplBanner(bFile);
await rpc("admin_add_banner",{p_token:S.token,p_type:bType,p_advertiser:adv,p_title:document.getElementById("b-title").value.trim(),p_description:document.getElementById("b-desc").value.trim(),p_link:document.getElementById("b-link").value.trim(),p_image:url});
bFile=null;document.getElementById("b-img").value="";document.getElementById("b-prev").hidden=true;
document.getElementById("b-adv").value="";document.getElementById("b-title").value="";document.getElementById("b-desc").value="";document.getElementById("b-link").value="";
toast("✅ Publicité ajoutée");await refreshAll();
}catch(e){status("⚠️ "+(e.message||"Erreur"),"err");}
}

async function loadBanners(){
const list=await rpc("admin_list_banners",{p_token:S.token});
let html="";
if(list&&list.length){
for(let i=0;i<list.length;i++){
const b=list[i];
const isHero=(b.type!=="card");
html+='<div class="card"><div class="row">'+
'<img class="bthumb" src="'+esc(b.image_url)+'" alt="">'+
'<div class="grow"><div class="t">'+esc(b.advertiser||"Annonceur")+'</div>'+
'<div class="m">'+esc(b.title||"sans titre")+'</div></div>'+
'<span class="badge '+(isHero?"b-hero":"b-card")+'">'+(isHero?"🏆 HERO":"📢 CARTE")+'</span>'+
'<span class="badge '+(b.active?"b-active":"b-hidden")+'">'+(b.active?"ON":"OFF")+'</span>'+
'<button class="btn sm gray" onclick="toggleBanner('+b.id+')">'+(b.active?"Éteindre":"Allumer")+'</button>'+
'<button class="btn sm red" onclick="delBanner('+b.id+')">Supprimer</button>'+
'</div></div>';
}
}else html='<p class="sub">Aucune publicité. Crée la première ci-dessus 👆</p>';
document.getElementById("banners-rows").innerHTML=html;
}

async function toggleBanner(id){
status("Modification…","wait");
try{await rpc("admin_toggle_banner",{p_token:S.token,p_id:id});toast("✅ Fait");await refreshAll();}
catch(e){status("⚠️ "+(e.message||"Erreur"),"err");}
}

async function delBanner(id){
if(!confirm("Supprimer cette publicité ?"))return;
status("Suppression…","wait");
try{await rpc("admin_delete_banner",{p_token:S.token,p_id:id});toast("🗑️ Supprimée");await refreshAll();}
catch(e){status("⚠️ "+(e.message||"Erreur"),"err");}
}

if(S){try{openPanel();}catch(e){showErr("Erreur ouverture session : "+e.message);}}
</script>
</body>
</html>
